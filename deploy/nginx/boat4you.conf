# Width fallback for the /_next/image redirect below: Next always sends w=,
# but a hand-made request may not - never emit a bare "?width=" to Bunny.
map $arg_w $b4y_img_width {
    ""       1200;
    default  $arg_w;
}

server {
    root /var/www/admin.boat4you.com/html;
    # b4y-admin-security-headers
    server_tokens off;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https:; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    index index.html index.htm index.nginx-debian.html;

    server_name admin.boat4you.com;

    location / {
        try_files $uri /index.html =404;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.boat4you.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.boat4you.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    server_name www.boat4you.com;
    # Security headers (audit A3, 17.7.2026). No CSP here: Next.js inline
    # runtime scripts need nonces we do not thread through nginx.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Google Site Verification (service-account claude-seo, 2026-06-11) —
    # served at the edge so the SA can self-verify GSC ownership; the same
    # file is also committed to the repo's public/ for durability.
    location = /google77c1a7061dbbb424.html {
        default_type text/plain;
        return 200 "google-site-verification: google77c1a7061dbbb424.html";
    }

    # 301 retired blog posts -> closest current guide (GSC 404 cleanup, link equity)
    location ~ ^(/(?:fr|de|it|es|pt|nl|pl|hr))?/blog/what-is-a-boat-hostess/?$ { return 301 $1/blog/a-day-in-the-life-on-a-charter-yacht; }
    location ~ ^(/(?:fr|de|it|es|pt|nl|pl|hr))?/blog/the-ultimate-guide-to-sailing-north-dalmatia/?$ { return 301 $1/blog/croatia-sailing-guide-2026; }
    location ~ ^(/(?:fr|de|it|es|pt|nl|pl|hr))?/blog/is-a-security-deposit-required-for-renting-a-yacht/?$ { return 301 $1/blog/yacht-charter-cost-2026-full-breakdown; }
    location ~ ^(/(?:fr|de|it|es|pt|nl|pl|hr))?/blog/what-insurance-is-needed-for-a-yacht-charter-in-croatia-and-greece/?$ { return 301 $1/blog/yacht-charter-cost-2026-full-breakdown; }

    # /_next/image is DEAD by design since the Bunny CDN migration (7.7.2026):
    # next.config.js uses a custom loader, which disables Next's built-in image
    # optimizer endpoint, so it 404s for EVERY image (valid or not) and burns a
    # 9.3 KB HTML body per hit. Live pages no longer emit these URLs at all, but
    # crawlers keep replaying their pre-migration inventory - ~16k hits/day, 87%
    # meta-externalagent (measured 2.8.2026), 31k distinct image ids, most of them
    # still-valid photos. Redirect the percent-encoded `url=` straight to the CDN
    # so the crawler fetches the real image and relearns the URL; dead ids get
    # Bunny's own cheap 404 instead of ours. Anything not matching the image
    # pattern falls through to Next exactly as before.
    location = /_next/image {
        if ($arg_url ~* "^https?%3A%2F%2F[^%]+%2Fpublic%2Fimage%2F([0-9]+)") {
            return 301 https://boat4you.b-cdn.net/public/image/$1?width=$b4y_img_width;
        }
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }



    # De-WordPress: serve WP media under the main domain so wp.boat4you.com
    # never appears in blog HTML (FE rewrites all WP URLs in lib/api).
    location /wp-content/ {
        # Resolve the WP upstream at REQUEST time (variable + resolver), not at
        # config load. With a literal hostname nginx resolves it during startup/
        # config test, so a transient DNS blip takes the whole server down --
        # exactly the 2026-06-10 outage (apt-daily restarted networkd mid
        # certbot/nginx restart; "host not found in upstream wp.boat4you.com"
        # kept nginx failed for ~6 min). Worst case now: only /wp-content/
        # requests 502 during a blip; the site itself stays up.
        resolver 127.0.0.53 1.1.1.1 valid=300s ipv6=off;
        set $wp_upstream wp.boat4you.com;
        proxy_pass https://$wp_upstream;
        proxy_set_header Host wp.boat4you.com;
        proxy_ssl_server_name on;
        proxy_hide_header Set-Cookie;
    }


    location / {
        proxy_pass http://127.0.0.1:3001;
        #proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (safe to include)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Helpful timeouts
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.boat4you.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.boat4you.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



}
server {
    if ($host = admin.boat4you.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot



    server_name admin.boat4you.com;


    listen 80;
    return 404; # managed by Certbot


}


server {
    if ($host = boat4you.com) {
        return 301 https://www.boat4you.com$request_uri;
    } # managed by Certbot


    server_name boat4you.com;


    listen 80;
    return 404; # managed by Certbot


}

# Apex -> www canonical 301 (added 2026-06-11): Google was indexing both hosts.
server {
    listen 443 ssl http2;
    server_name boat4you.com;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    ssl_certificate /etc/letsencrypt/live/www.boat4you.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.boat4you.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://www.boat4you.com$request_uri;
}
